    crafty-unavailable:
      - "<prefix><red><bold>FEHLER: Crafty Controller nicht erreichbar!"
      - "<red>ScamUpdates wurde deaktiviert."
      - "<dark_gray>Ursache: <reason>"
      - "<gray>Pruefe crafty.connection.* und die SSL-Einstellungen in der config.yml."
    crafty-auth:
      - "<prefix><red><bold>FEHLER: Crafty-Authentifizierung fehlgeschlagen!"
      - "<red>ScamUpdates wurde deaktiviert."
      - "<dark_gray>Ursache: <reason>"
