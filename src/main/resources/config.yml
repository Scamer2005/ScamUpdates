# ScamUpdates - Konfiguration (Nachrichten: MiniMessage). Details: README.md und docs/.
# Fehlende Schluessel werden bei Updates ergaenzt; vorher entsteht config.yml.bak-v<alte Version>.
config-version: 2

# Vom Betreiber getestete Minecraft-Versionen, z. B. ["1.20.4", "1.21.11", "26.1.2", "26.2", "26.3"]. Nur diese gelten als "getestet".
compat:
  tested-versions: []

# Update-Protokoll (history.jsonl). Tokens werden nie gespeichert.
history:
  enabled: true
  retention-days: 90 # 0 = nie loeschen
  max-entries: 5000

general:
  debug: false

# Crafty fuer die Serversteuerung verwenden. Bei false wird der lokale Neustart (/restart) genutzt.
# Einrichtung: docs/CRAFTY.md
crafty:
  enabled: true
  connection:
    base-url: "https://crafty.example.com"
    api-base-path: "/api/v2"
    api-token: "HIER_API_TOKEN_EINTRAGEN"
    server-id: "HIER_SERVER_ID_EINTRAGEN"
    timeout: 10000 # Millisekunden
    verify-ssl: true # false nur in vertrauenswuerdigen Netzen
    ca-certificate-file: "" # PEM-Datei fuer selbst signierte Zertifikate
    allow-http: false
  restart:
    enabled: true
    require-pending-updates: false # true = Neustart nur mit vorgemerkten Updates

# Lokaler Neustart bei crafty.enabled: false. Benoetigt ein vorhandenes restart-script in der spigot.yml.
local-restart:
  command: "restart"

startup:
  allow-reload-recovery: true # "config reload" darf den Fehlerzustand beheben
  internet-check:
    targets:
      - "https://www.cloudflare.com/cdn-cgi/trace"
      - "https://api.github.com"
      - "https://api.modrinth.com"
      - "https://hangar.papermc.io"
    timeout: 5000 # Millisekunden pro Ziel

behavior:
  check-on-start: true
  check-interval-minutes: 360 # 0 = aus
  allow-multiple-checks: false
  check-cooldown-seconds: 60
  default-channel: stable # stable | beta | development
  require-minecraft-match: true
  treat-unknown-version-order-as-update: false
  page-size: 8

notifications:
  enabled: true
  join-delay-ticks: 40
  mode: once-per-update-set # oder once-ever-until-reset
  renotify-after-minutes: 0 # 0 = nie
  include-pending-matches: true
  title:
    enabled: false
    title: "<gold>ScamUpdates"
    subtitle: "<yellow><count> Update(s) verfuegbar"

# Sicherheitsabfragen. enabled: false schaltet alle ab (nicht empfohlen).
confirmations:
  enabled: true
  timeout-seconds: 30
  max-pending-per-player: 5
  method: anvil # anvil = Code im Amboss-Fenster, chat = klickbarer Token
  code-length: 6
  max-attempts: 3
  actions:
    check: true # veraltet, wird ignoriert (Update-Check braucht keinen Code)
    download: true
    restore: true
    backup-delete: true
    restart: true # nur fuer /scamupdates restart; Neustart-Planung braucht keinen Code
    exclude: true
    include: true

downloads:
  max-size-mb: 128
  timeout-seconds: 120
  max-parallel: 2
  allow-http: false
  require-checksum: false
  all-or-nothing: false # true = bei einem Fehler wird nichts vorgemerkt

http:
  user-agent: "" # leer = ScamUpdates/<Version>
  timeout-seconds: 15
  retries: 2
  request-delay-ms: 150

matching:
  auto-assign-single-match: true # mehrere Treffer werden nie automatisch gewaehlt
  retry-unmatched-hours: 24

sources:
  modrinth:
    enabled: true
  hangar:
    enabled: true
  spigot:
    enabled: true # ueber Spiget
  github:
    enabled: true
    token: "" # optional, hebt das Rate-Limit an
  jenkins:
    enabled: true
  direct:
    enabled: true

# Manuelle Zuordnung (ersetzt die Suche), siehe README. Beispiel:
# plugins:
#   MeinPlugin: {source: modrinth, project-id: "slug", channel: stable}
plugins: {}

queue:
  snooze-minutes: 60 # Pausenzeit bei "Spaeter" in Minuten
  notify-on-join: true

restarts:
  enabled: true
  timezone: "Europe/Berlin"
  warning-seconds: [300, 180, 60, 30, 10, 5, 4, 3, 2, 1]

sounds:
  # Format "sound.key;lautstaerke;tonhoehe", leer = kein Ton.
  notify: "entity.experience_orb.pickup;1.0;1.0"
  success: "entity.player.levelup;0.7;1.2"
  error: "block.note_block.bass;1.0;0.6"
  confirm: "block.note_block.pling;1.0;1.4"
  restart-warning: "block.note_block.pling;1.0;1.0"
  restart-countdown: "block.note_block.hat;1.0;1.2"

buttons:
  show-updates:
    text: "<aqua>[Updates anzeigen]</aqua>"
    hover: "<gray>Zeigt alle verfuegbaren Updates"
  update-now:
    text: "<green>[Jetzt aktualisieren]</green>"
    hover: "<gray>Startet den Update-Vorgang (mit Bestaetigung)"
  later:
    text: "<gray>[Spaeter]</gray>"
    hover: "<gray>Erinnere mich spaeter"
  confirm:
    text: "<green><bold>[Bestaetigen]</bold></green>"
    hover: "<gray>Aktion jetzt ausfuehren"
  cancel:
    text: "<red>[Abbrechen]</red>"
    hover: "<gray>Aktion abbrechen"
  restart-now:
    text: "<gold>[Jetzt neu starten]</gold>"
    hover: "<gray>Neustart ueber Crafty Controller (mit Bestaetigung)"
  select:
    text: "<yellow>[Auswaehlen]</yellow>"
    hover: "<gray>Treffer fuer dieses Plugin anzeigen"
  pick-none:
    text: "<red>[Keins davon]</red>"
    hover: "<gray>Kein Treffer passt: Plugin wird nicht automatisch aktualisiert"
  prev:
    text: "<yellow>[«]</yellow>"
    hover: "<gray>Vorherige Seite"
  next:
    text: "<yellow>[»]</yellow>"
    hover: "<gray>Naechste Seite"
  queue-update-now:
    text: "<green>[Jetzt aktualisieren]</green>"
    hover: "<gray>Startet den Update-Vorgang fuer dieses Plugin (mit Bestaetigung)"
  queue-later:
    text: "<gray>[Spaeter]</gray>"
    hover: "<gray>Eintrag bleibt erhalten und erinnert spaeter erneut"
  queue-dismiss:
    text: "<red>[Nicht mehr erinnern]</red>"
    hover: "<gray>Entfernt diesen Eintrag dauerhaft aus der Warteschlange"
  queue-choose:
    text: "<yellow>[Kandidaten waehlen]</yellow>"
    hover: "<gray>Zwischen mehreren gefundenen Projekten waehlen"

