  busy: "<prefix><red>Es laeuft bereits eine Aktion (<operation>). Bitte warten."
  usage: "<prefix><gray>Verwendung: <white><usage>"
  unknown-plugin: "<prefix><red>Plugin <white><plugin></white> wurde nicht gefunden."
  error-generic: "<prefix><red>Fehler: <error>"
  later: "<prefix><gray>Okay, ich erinnere dich spaeter."
  help:
    - "<prefix><gold>Befehle:"
    - "<yellow>/scamupdates check <gray>- Nach Updates suchen"
    - "<yellow>/scamupdates list [updates|all] [Seite] <gray>- Plugins/Updates anzeigen"
    - "<yellow>/scamupdates download <gray>- Gefundene Updates herunterladen"
    - "<yellow>/scamupdates status <gray>- Status anzeigen"
    - "<yellow>/scamupdates restore [Plugin|all] <gray>- Backup wiederherstellen"
    - "<yellow>/scamupdates backup list|delete [Plugin|all] <gray>- Backups verwalten"
    - "<yellow>/scamupdates restart <gray>- Neustart ausloesen (Crafty oder lokal)"
    - "<yellow>/scamupdates sources <gray>- Updatequellen anzeigen"
    - "<yellow>/scamupdates match [Plugin] <gray>- Offene Zuordnungen"
    - "<yellow>/scamupdates exclude|include [Plugin] <gray>- Plugin ausschliessen/einbeziehen"
    - "<yellow>/scamupdates config reload <gray>- Config neu laden"
    - "<yellow>/scamupdates single check|update <Plugin> <gray>- Einzelplugin verwalten"
    - "<yellow>/scamupdates queue [add|remove|later|dismiss|check|download] [Plugin] <gray>- Update-Warteschlange"
    - "<yellow>/scamupdates schedule [list|add|toggle|remove|onetime|cancel] <gray>- Geplante & einmalige Neustarts"
    - "<yellow>/scamupdates confirm [Token] | cancel <gray>- Bestaetigungen"

  error:
    missing-crafty:
